name: otus-dynamic-web

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: database:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Проверяем запрос по TCP от имени приложения после создания базы и пользователя.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    environment: *wordpress-environment
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - wordpress-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-config.php') && @fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 4s
      retries: 24

  wordpress-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "/usr/local/bin/init-wordpress.sh"]
    environment:
      <<: *wordpress-environment
      HOME: /tmp
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?}
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress-data:/var/www/html
      - ./init-wordpress.sh:/usr/local/bin/init-wordpress.sh:ro

  django:
    build: ./django
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}

  node:
    build: ./node
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      django:
        condition: service_started
      node:
        condition: service_started
      wordpress-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress-data:/var/www/html:ro

volumes:
  mysql-data:
  wordpress-data:

# Версия 1 · 2026-11-11 · Три приложения, инициализация WordPress и вход через Nginx.
