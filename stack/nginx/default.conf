# DNS Docker обновляет адреса контейнеров после их пересоздания.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8081;
    add_header X-Otus-App django always;

    location / {
        set $django_backend django:8000;
        proxy_set_header Host $http_host;
        proxy_pass http://$django_backend;
    }
}

server {
    listen 8082;
    add_header X-Otus-App node always;

    location / {
        set $node_backend node:3000;
        proxy_set_header Host $http_host;
        proxy_pass http://$node_backend;
    }
}

server {
    listen 8083;
    add_header X-Otus-App wordpress always;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        set $wordpress_backend wordpress:9000;
        fastcgi_pass $wordpress_backend;
    }
}

# Версия 1 · 2026-11-11 · HTTP для Django и Node.js, FastCGI для WordPress.
